name: Build Angular

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: git-fun-angular/package-lock.json

      - name: Installer dependencies
        working-directory: git-fun-angular
        run: npm ci

      - name: Build
        working-directory: git-fun-angular
        run: npm run build